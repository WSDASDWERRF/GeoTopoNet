[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geotoponet-v5"
version = "5.0.0"
description = "GeoTopoNet-V5: physics-constrained fracture segmentation for volcanic-rock micro-CT (single released model)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GeoTopoNet-V5 authors"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.20",
    "Pillow>=9.5",
    "tifffile>=2023.1",
    "torch>=2.3",
    "torchvision>=0.18",
]

[project.scripts]
geotoponet-train = "geotoponet.train:main"
geotoponet-eval = "geotoponet.evaluate:main"
geotoponet-infer = "geotoponet.infer:main"

[tool.setuptools.packages.find]
include = ["geotoponet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
